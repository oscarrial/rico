name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      actualizar_dependencias:
        description: "Resolver dependencias de nuevo (ignora Config/Package.resolved)"
        type: boolean
        default: false
      extraer_textos:
        description: "Exportar los textos de la app (.xliff y catálogos) como artefacto «localizacion»"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lógica pura (emparejado, importes, estrellas): rápido y barato en Linux.
  nucleo:
    name: RicoCore (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Pruebas de RicoCore
        run: swift test --package-path Packages/RicoCore

  # App iOS: genera el proyecto, compila y pasa las pruebas en el simulador.
  ios:
    name: App iOS (simulador)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Elegir Xcode 26.3
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.3"

      - name: Instalar XcodeGen 2.46.0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Claves de Supabase (si están configuradas)
        env:
          RICO_SUPABASE_HOST: ${{ secrets.RICO_SUPABASE_HOST }}
          RICO_SUPABASE_CLAVE: ${{ secrets.RICO_SUPABASE_CLAVE }}
        run: |
          if [ -n "$RICO_SUPABASE_HOST" ] && [ -n "$RICO_SUPABASE_CLAVE" ]; then
            printf 'RICO_SUPABASE_HOST = %s\nRICO_SUPABASE_CLAVE = %s\n' "$RICO_SUPABASE_HOST" "$RICO_SUPABASE_CLAVE" > Config/Secretos.xcconfig
            echo "Supabase configurado"
          else
            echo "Sin claves de Supabase: la app se compila en modo solo local"
          fi

      - name: Generar Rico.xcodeproj
        run: xcodegen generate

      - name: Fijar versiones de dependencias
        if: ${{ !inputs.actualizar_dependencias }}
        run: |
          mkdir -p Rico.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Config/Package.resolved Rico.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Caché de paquetes Swift
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/SourcePackages
          key: spm-${{ hashFiles('Config/Package.resolved') }}

      - name: Compilar y probar en el simulador
        run: |
          set -o pipefail
          mkdir -p build
          FIJAR=""
          if [ "${{ inputs.actualizar_dependencias }}" != "true" ]; then FIJAR="-onlyUsePackageVersionsFromResolvedFile"; fi
          SIMULADOR=$(xcrun simctl list devices available | grep -m1 -E '^\s+iPhone' | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          echo "Simulador: $SIMULADOR"
          xcodebuild test \
            -project Rico.xcodeproj \
            -scheme Rico \
            -destination "id=$SIMULADOR" \
            -resultBundlePath build/Resultados.xcresult \
            -clonedSourcePackagesDirPath build/SourcePackages \
            $FIJAR \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/xcodebuild.log | xcbeautify --renderer github-actions

      - name: Guardar Package.resolved
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-resolved
          path: Rico.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: error

      - name: Subir resultados si falla
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resultados-ios
          path: |
            build/Resultados.xcresult
            build/xcodebuild.log

  # Manual: exporta los textos de la app sin necesitar Xcode en local.
  # Uso: gh workflow run ci.yml --ref <rama> -f extraer_textos=true
  textos:
    name: Extraer textos (manual)
    if: ${{ inputs.extraer_textos }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Elegir Xcode 26.3
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.3"

      - name: Instalar XcodeGen 2.46.0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generar Rico.xcodeproj y fijar dependencias
        run: |
          xcodegen generate
          mkdir -p Rico.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Config/Package.resolved Rico.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Exportar textos
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -exportLocalizations \
            -project Rico.xcodeproj \
            -localizationPath build/localizacion \
            -exportLanguage es \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/exportar-textos.log | tail -n 40
          mkdir -p build/catalogos
          find Packages App -name '*.xcstrings' | while read -r f; do mkdir -p "build/catalogos/$(dirname "$f")"; cp "$f" "build/catalogos/$f"; done

      - name: Subir textos
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: localizacion
          path: |
            build/localizacion
            build/catalogos
            build/exportar-textos.log
          if-no-files-found: error
