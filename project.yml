# Proyecto de Xcode generado con XcodeGen: `xcodegen generate` crea Rico.xcodeproj.
# El .xcodeproj no se versiona; este fichero es la fuente de verdad.
name: Rico

options:
  bundleIdPrefix: es.rico
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true

configFiles:
  Debug: Config/Rico.xcconfig
  Release: Config/Rico.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Equipo de Apple Developer: rellenar para firmar (o pasar DEVELOPMENT_TEAM en CI).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  RicoKit:
    path: Packages/RicoKit

targets:
  Rico:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: RicoKit
        product: RicoKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Rico
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations: [es]
        UILaunchScreen:
          UIColorName: FondoInicio
          UIImageName: Logotipo
          UIImageRespectsSafeAreaInsets: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Enlaces de los correos de cuenta: rico://auth/confirmar y rico://auth/recuperar.
        # Avisos para valorar: rico://visita/<uuid>.
        CFBundleURLTypes:
          - CFBundleURLName: es.rico.app.auth
            CFBundleURLSchemes: [rico]
        # Solo HTTPS del sistema: no hay que declarar cifrado en cada subida.
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: "Para sugerirte las fotos que hiciste en cada restaurante y guardarlas en tu diario."
        # Captura de pagos: al pagar con Apple Pay, la ubicación ayuda a reconocer el restaurante.
        NSLocationWhenInUseUsageDescription: "Para reconocer en qué restaurante has pagado y apuntarlo en tu diario."
        RicoAppGroup: group.$(PRODUCT_BUNDLE_IDENTIFIER)
        RicoSupabaseHost: $(RICO_SUPABASE_HOST)
        RicoSupabaseClave: $(RICO_SUPABASE_CLAVE)
    entitlements:
      path: App/Rico.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        # App Group (group.$(PRODUCT_BUNDLE_IDENTIFIER)): se activará con la acción de Atajos.
        # Sin él, la base local vive en la carpeta de la app (ContenedorRico lo resuelve solo).
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.rico.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # Firma de distribución para TestFlight (perfil creado con la API de App Store Connect).
        Release:
          PROVISIONING_PROFILE_SPECIFIER: Rico App Store

  # Pruebas de los módulos de RicoKit en el simulador (sin app anfitriona).
  RicoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - package: RicoKit
        product: RicoKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.rico.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Rico:
    build:
      targets:
        Rico: all
        RicoTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - RicoTests
